<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página inicial | Cidran</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --bg-gradient-a: #0f172a;
            --bg-gradient-b: #1e293b;
            --text-color: #e2e8f0;
            --muted-color: #94a3b8;
            --accent-color: #38bdf8;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-a), var(--bg-gradient-b));
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            max-width: 560px;
            width: 100%;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 48px 40px;
            backdrop-filter: blur(6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 8px;
            letter-spacing: 0.02em;
        }

        h1 span {
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--muted-color);
            margin: 0 0 32px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--accent-color);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 28px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-color);
        }

        p.description {
            color: var(--muted-color);
            line-height: 1.6;
            margin: 0 0 32px;
        }

        footer {
            font-size: 0.8rem;
            color: var(--muted-color);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <main>
        <span class="badge"><span class="dot"></span>Em construção</span>
        <h1>Ol&aacute;, eu sou <span>Cidran</span></h1>
        <p class="subtitle">Bem-vindo &agrave; minha p&aacute;gina pessoal</p>
        <p class="description">
            Este site ainda est&aacute; sendo constru&iacute;do. Em breve haver&aacute; mais
            conte&uacute;do por aqui &mdash; volte em outro momento para conferir as novidades.
        </p>
        <footer>&copy; 2026 Cidran</footer>
    </main>
</body>
</html>
